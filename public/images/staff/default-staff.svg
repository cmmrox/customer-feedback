<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#grad1)" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Person icon -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#9ca3af"/>
    
    <!-- Body -->
    <path d="M-30 10 Q-30 40 -30 60 Q-30 80 30 80 Q30 60 30 40 Q30 10 30 10 Z" fill="#9ca3af"/>
    
    <!-- Arms -->
    <rect x="-40" y="15" width="20" height="40" rx="10" fill="#9ca3af"/>
    <rect x="20" y="15" width="20" height="40" rx="10" fill="#9ca3af"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    Staff Member
  </text>
</svg>
