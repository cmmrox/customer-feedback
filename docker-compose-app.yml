version: '3.8'

services:
  app:
    image: cmmrox/customer-feedback:${APP_IMAGE_TAG:-latest}
    container_name: customer-feedback-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: /app/uploads
      SESSION_TIMEOUT: 10000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network

volumes:
  uploads:

networks:
  app-network:
    driver: bridge
